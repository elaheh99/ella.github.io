<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>3D Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <style>
      :root{
        --ink:#4a3f55;
        --ink-soft:#7a6d8f;
        --paper:#fff9f1;
        --card:#fffdf8;
        --pink:#ef62a4;
        --pink-soft:#ffb9d6;
        --lav:#a87fe6;
        --lav-deep:#7448c4;
        --blue:#63b6ee;
        --mint:#6fd49b;
        --wood:#b9834f;
        --shadow:0 18px 50px rgba(90,60,110,.28);
        --radius:22px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --ink:#f3eafd;
          --ink-soft:#c9bde4;
          --paper:#2e2440;
          --card:#382c52;
          --pink-soft:#4c3560;
          --shadow:0 18px 50px rgba(0,0,0,.5);
        }
      }
      *{ box-sizing:border-box; }
      html,body{ height:100%; }
      body{
        margin:0;
        font-family:"Nunito",system-ui,sans-serif;
        color:var(--ink);
        overflow:hidden;
        background:#38aaea;
      }
      h1,h2,h3,.qfont{ font-family:"Quicksand",sans-serif; }
      #scene-wrap{ position:fixed; inset:0; }
      #scene-wrap canvas{ display:block; touch-action:none; }

      /* ---------- loader ---------- */
      #loader{
        position:fixed; inset:0; z-index:100;
        background:linear-gradient(160deg,#ff8fc6,#9c6ef2 55%,#3eaef0);
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
        transition:opacity .7s ease, visibility .7s;
      }
      #loader.done{ opacity:0; visibility:hidden; }
      .loader-room{ font-size:54px; animation:bob 1.4s ease-in-out infinite; }
      @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
      #loader p{ font-family:"Quicksand",sans-serif; font-weight:600; color:#6a4a99; margin:0; font-size:18px; }
      .loader-dots{ display:flex; gap:8px; }
      .loader-dots span{ width:10px; height:10px; border-radius:50%; background:#f7a8c4; animation:dotp 1s ease-in-out infinite; }
      .loader-dots span:nth-child(2){ background:#cfc3f2; animation-delay:.15s; }
      .loader-dots span:nth-child(3){ background:#a8d8f0; animation-delay:.3s; }
      @keyframes dotp{ 0%,100%{ transform:scale(.7); opacity:.5;} 50%{ transform:scale(1.25); opacity:1;} }

      /* ---------- top right buttons ---------- */
      .top-actions{
        position:fixed; top:calc(14px + env(safe-area-inset-top)); right:16px; z-index:20;
        display:flex; gap:10px;
      }
      .round-btn{
        width:46px; height:46px; border-radius:50%;
        border:2px solid rgba(255,255,255,.85);
        background:var(--card); color:var(--ink);
        font-size:20px; cursor:pointer;
        box-shadow:0 6px 18px rgba(90,60,110,.25);
        display:flex; align-items:center; justify-content:center;
        transition:transform .15s ease, background .2s;
      }
      .round-btn:hover{ transform:translateY(-2px) scale(1.06); }
      .round-btn:active{ transform:scale(.95); }

      /* ---------- hint pill ---------- */
      #hint{
        position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%);
        z-index:15; background:rgba(255,253,248,.92); color:#6b5a86;
        font-family:"Quicksand",sans-serif; font-weight:600; font-size:13.5px;
        padding:9px 18px; border-radius:999px;
        box-shadow:0 8px 22px rgba(90,60,110,.22);
        border:2px solid #ffb9d4;
        white-space:nowrap; max-width:94vw;
        overflow:hidden; text-overflow:ellipsis;
        transition:opacity .5s;
      }
      @media (prefers-color-scheme: dark){
        #hint{ background:rgba(46,36,64,.92); color:#e7ddff; border-color:#5a4785; }
      }

      /* ---------- tooltip ---------- */
      #tooltip{
        position:fixed; z-index:40; pointer-events:none;
        background:#4a3f55; color:#fff;
        font-family:"Quicksand",sans-serif; font-weight:600; font-size:12.5px;
        padding:6px 12px; border-radius:999px;
        transform:translate(-50%,-160%);
        opacity:0; transition:opacity .15s;
        white-space:nowrap;
        box-shadow:0 6px 16px rgba(0,0,0,.3);
      }
      #tooltip.show{ opacity:1; }

      /* ---------- panels ---------- */
      .panel{
        position:fixed; inset:0; z-index:30;
        display:flex; align-items:center; justify-content:center;
        padding:18px;
        opacity:0; visibility:hidden;
        transition:opacity .45s ease, visibility .45s;
      }
      .panel.open{ opacity:1; visibility:visible; }
      .card{
        background:var(--card);
        border-radius:var(--radius);
        box-shadow:var(--shadow);
        transform:translateY(16px) scale(.96);
        transition:transform .45s cubic-bezier(.22,1.4,.36,1);
        max-height:88vh; overflow-y:auto;
        overscroll-behavior:contain;
      }
      .panel.open .card{ transform:translateY(0) scale(1); }

      .back-btn{
        font-family:"Quicksand",sans-serif; font-weight:700; font-size:13.5px;
        background:var(--pink-soft); color:var(--ink);
        border:2px solid var(--pink);
        padding:8px 16px; border-radius:999px; cursor:pointer;
        transition:transform .15s, background .2s;
      }
      .back-btn:hover{ transform:translateX(-3px); background:var(--pink); color:#fff; }
      .back-btn.corner{ position:absolute; top:16px; right:16px; z-index:2; }
      .mini-back{
        font-family:"Quicksand",sans-serif; font-weight:700; font-size:13px;
        background:none; border:none; color:var(--lav-deep); cursor:pointer; padding:4px 0;
      }
      .mini-back:hover{ text-decoration:underline; }

      /* --- MY WORK : mac window --- */
      .mac-window{
        width:min(900px,94vw);
        display:flex; flex-direction:column;
        overflow:hidden;
      }
      .mac-bar{
        display:flex; align-items:center; gap:8px;
        background:linear-gradient(180deg,#e9dbfc,#dcc8f8);
        padding:12px 16px;
        border-bottom:2px solid #cdb2f0;
        position:sticky; top:0; z-index:3;
      }
      @media (prefers-color-scheme: dark){
        .mac-bar{ background:linear-gradient(180deg,#4a3a6e,#41335f); border-color:#5a4785; }
      }
      .dot{ width:13px; height:13px; border-radius:50%; flex:none; }
      .dot.r{ background:#ff8fa3; } .dot.y{ background:#ffd166; } .dot.g{ background:#8fd6a4; }
      .mac-title{
        font-family:"Quicksand",sans-serif; font-weight:700; font-size:15px;
        margin:0 auto; color:var(--ink);
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      .mac-bar .back-btn{ flex:none; }
      .mac-body{
        padding:20px 22px 26px;
        overflow-y:auto;
        background:
          radial-gradient(circle at 15% 20%, #ffd3e6 0, transparent 45%),
          radial-gradient(circle at 85% 90%, #bcdffb 0, transparent 45%),
          var(--card);
      }
      .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
      .chip{
        font-family:"Quicksand",sans-serif; font-weight:700; font-size:13px;
        padding:7px 15px; border-radius:999px; cursor:pointer;
        border:2px solid var(--lav); background:var(--card); color:var(--ink);
        transition:all .15s;
      }
      .chip:hover{ transform:translateY(-2px); }
      .chip.active{ background:var(--lav-deep); border-color:var(--lav-deep); color:#fff; }
      .grid{
        display:grid; gap:16px;
        grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      }
      .proj{
        border-radius:18px; padding:18px 16px; cursor:pointer;
        border:2px solid rgba(0,0,0,.05);
        transition:transform .18s ease, box-shadow .18s ease;
        color:#4a3f55;
      }
      .proj:hover{ transform:translateY(-5px) rotate(-.5deg); box-shadow:0 14px 28px rgba(90,60,110,.22); }
      .proj .thumb{ font-size:42px; line-height:1; margin-bottom:10px; }
      .proj h3{ margin:0 0 4px; font-size:16.5px; }
      .proj .cat{
        display:inline-block; font-size:11px; font-weight:800; letter-spacing:.4px;
        text-transform:uppercase; background:rgba(255,255,255,.65);
        padding:3px 9px; border-radius:999px; margin-bottom:8px;
      }
      .proj p{ margin:0 0 12px; font-size:13.5px; line-height:1.45; color:#5d5170; }
      .tags{ display:flex; flex-wrap:wrap; gap:5px; }
      .tag{
        font-size:11px; font-weight:700; background:rgba(255,255,255,.75);
        padding:3px 8px; border-radius:999px; color:#6b5a86;
      }
      .detail-hero{ font-size:64px; text-align:center; padding:10px 0 4px; }
      #detail-content h2{ text-align:center; margin:6px 0 2px; font-size:26px; }
      #detail-content .d-cat{ text-align:center; color:var(--ink-soft); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.6px; }
      #detail-content .d-desc{ font-size:15.5px; line-height:1.6; max-width:56ch; margin:16px auto; }
      #detail-content .tags{ justify-content:center; margin-bottom:20px; }
      #detail-content .tags .tag{ background:var(--pink-soft); font-size:12.5px; padding:5px 12px; }
      .d-link{
        display:block; width:fit-content; margin:0 auto;
        font-family:"Quicksand",sans-serif; font-weight:700;
        background:var(--lav-deep); color:#fff; text-decoration:none;
        padding:11px 22px; border-radius:999px;
        transition:transform .15s;
      }
      .d-link:hover{ transform:scale(1.05); }

      /* --- ABOUT card --- */
      .about-card{
        width:min(580px,94vw);
        padding:30px 32px 34px;
        position:relative;
        border:3px solid var(--pink-soft);
        background:
          radial-gradient(circle at 92% 6%, #ffd3e6 0, transparent 40%),
          var(--card);
      }
      .about-head{ display:flex; gap:18px; align-items:center; margin-bottom:6px; padding-right:120px; }
      .avatar-emoji{
        font-size:40px; width:76px; height:76px; flex:none;
        display:flex; align-items:center; justify-content:center;
        background:var(--pink-soft); border:3px solid var(--pink);
        border-radius:50%;
      }
      .about-head h2{ margin:0; font-size:27px; line-height:1.15; }
      .about-head p{ margin:4px 0 0; color:var(--lav-deep); font-weight:700; font-size:14.5px; }
      .about-card h3{
        margin:22px 0 8px; font-size:16px; color:var(--lav-deep);
        display:flex; align-items:center; gap:8px;
      }
      .about-card p{ margin:0; line-height:1.6; font-size:15px; }
      .about-card ul{ margin:0; padding-left:20px; line-height:1.65; font-size:15px; }
      .pills{ display:flex; flex-wrap:wrap; gap:8px; }
      .pill{
        font-family:"Quicksand",sans-serif; font-weight:700; font-size:13px;
        padding:7px 14px; border-radius:999px;
        background:var(--pink-soft); border:2px solid var(--pink); color:var(--ink);
      }
      .pill:nth-child(3n+2){ background:#d3e9ff; border-color:var(--blue); }
      .pill:nth-child(3n){ background:#d2f5da; border-color:var(--mint); }

      /* --- CONTACT notebook --- */
      .notebook{
        width:min(520px,94vw);
        position:relative;
        padding:32px 30px 30px 52px;
        border-radius:14px 22px 22px 14px;
        background:
          repeating-linear-gradient(180deg, transparent 0 30px, rgba(110,170,220,.55) 30px 31px),
          var(--paper);
        border:2px solid #e8d2b5;
      }
      .notebook::before{
        content:""; position:absolute; top:0; bottom:0; left:36px; width:2px;
        background:rgba(247,168,196,.7);
      }
      .notebook::after{
        content:""; position:absolute; top:14px; bottom:14px; left:10px; width:14px;
        background-image:radial-gradient(circle, #d9c6a5 4.5px, rgba(0,0,0,.12) 5px, transparent 6px);
        background-size:14px 44px; background-repeat:repeat-y;
      }
      .notebook h2{ margin:0 0 4px; font-size:28px; padding-right:110px; }
      .avail{ color:var(--lav-deep); font-weight:700; margin:0 0 18px; font-size:14.5px; line-height:1.5; }
      .contact-row{
        display:flex; align-items:center; gap:14px;
        padding:11px 14px; margin-bottom:9px;
        background:rgba(255,255,255,.75); border:2px solid #f0cfe2;
        border-radius:14px; text-decoration:none; color:var(--ink);
        transition:transform .15s, border-color .15s;
        font-weight:700; font-size:14.5px;
        word-break:break-all;
      }
      @media (prefers-color-scheme: dark){
        .contact-row{ background:rgba(255,255,255,.08); border-color:#5a4785; }
      }
      .contact-row:hover{ transform:translateX(4px); border-color:var(--pink); }
      .contact-row .ico{
        width:38px; height:38px; flex:none; border-radius:12px;
        display:flex; align-items:center; justify-content:center; font-size:19px;
        background:var(--pink-soft);
      }
      .contact-row small{ display:block; font-weight:600; color:var(--ink-soft); font-size:11.5px; }
      .notebook form{ margin-top:20px; }
      .notebook form h3{ margin:0 0 12px; font-size:16px; }
      .notebook input,.notebook textarea{
        width:100%; font-family:"Nunito",sans-serif; font-size:14.5px;
        padding:11px 14px; margin-bottom:10px;
        border:2px solid #dfc39e; border-radius:12px;
        background:rgba(255,255,255,.85); color:#4a3f55;
      }
      .notebook textarea{ min-height:84px; resize:vertical; }
      .notebook input:focus,.notebook textarea:focus{ outline:none; border-color:var(--pink); }
      #send-btn{
        font-family:"Quicksand",sans-serif; font-weight:700; font-size:15px;
        width:100%; padding:13px; border:none; border-radius:999px; cursor:pointer;
        background:var(--pink); color:#fff;
        box-shadow:0 8px 20px rgba(240,130,175,.4);
        transition:all .25s;
      }
      #send-btn:hover{ transform:translateY(-2px); }
      #send-btn.sent{ background:#7fce9b; box-shadow:0 8px 20px rgba(110,200,150,.45); }

      @media (max-width:640px){
        #hint{ font-size:12px; padding:8px 13px; white-space:normal; text-align:center; line-height:1.45; border-radius:18px; }
        .grid{ grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
        .mac-body{ padding:16px 14px 20px; }
        .about-card{ padding:24px 20px 28px; }
        .about-head{ padding-right:0; flex-direction:column; text-align:center; gap:10px; }
        .back-btn.corner{ position:static; display:block; margin:0 0 14px auto; width:fit-content; }
        .notebook h2{ padding-right:0; }
        .notebook{ padding:24px 18px 24px 44px; }
      }
      @media (prefers-reduced-motion: reduce){
        .card,.panel,.loader-room,.loader-dots span{ animation:none !important; transition:none !important; }
      }
    </style>
  </head>
  <body>
    <div id="loader" aria-hidden="true">
      <div class="loader-room">🏠</div>
      <p>building your tiny room…</p>
      <div class="loader-dots"><span></span><span></span><span></span></div>
    </div>

    <div id="scene-wrap"></div>

    <div class="top-actions">
      <button class="round-btn" id="btn-daynight" title="Toggle day / night" aria-label="Toggle day and night">🌙</button>
      <button class="round-btn" id="btn-reset" title="Reset view" aria-label="Reset view">⟲</button>
    </div>

    <div id="hint">🖱️ Drag to explore · scroll to zoom · click the wooden signs, iMac, photo &amp; notebook</div>
    <div id="tooltip"></div>

    <!-- ============ MY WORK panel ============ -->
    <section class="panel" id="panel-work" aria-hidden="true">
      <div class="card mac-window">
        <div class="mac-bar">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="mac-title" id="mac-title">My Work</span>
          <button class="back-btn" data-back>← back to room</button>
        </div>
        <div class="mac-body">
          <div id="gallery-view">
            <div class="chips" id="chips"></div>
            <div class="grid" id="project-grid"></div>
          </div>
          <div id="detail-view" hidden>
            <button class="mini-back" id="detail-back">← all projects</button>
            <div id="detail-content"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ ABOUT panel ============ -->
    <section class="panel" id="panel-about" aria-hidden="true">
      <div class="card about-card">
        <button class="back-btn corner" data-back>← back to room</button>
        <div class="about-head">
          <div class="avatar-emoji" id="about-emoji">🌸</div>
          <div>
            <h2 id="about-name"></h2>
            <p id="about-tagline"></p>
          </div>
        </div>
        <p id="about-intro"></p>
        <h3>🌱 My background</h3>
        <p id="about-background"></p>
        <h3>🎓 Education</h3>
        <ul id="about-education"></ul>
        <h3>💡 What I do</h3>
        <ul id="about-whatido"></ul>
        <h3>🛠️ Skills &amp; tools</h3>
        <div class="pills" id="about-skills"></div>
        <h3>✨ A few fun facts</h3>
        <ul id="about-facts"></ul>
      </div>
    </section>

    <!-- ============ CONTACT panel ============ -->
    <section class="panel" id="panel-contact" aria-hidden="true">
      <div class="card notebook">
        <button class="back-btn corner" data-back>← back to room</button>
        <h2>Let’s connect!</h2>
        <p class="avail" id="contact-availability"></p>
        <div id="contact-rows"></div>
        <form id="contact-form" novalidate>
          <h3>✉️ Send me a message</h3>
          <input type="text" name="name" placeholder="Your name" required />
          <input type="email" name="email" placeholder="Your email" required />
          <textarea name="message" placeholder="Say hi…" required></textarea>
          <button type="submit" id="send-btn">Send ✉️</button>
        </form>
      </div>
    </section>

    <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
    <script>
    /* ================================================================
       ★★★  EDIT YOUR CONTENT HERE  ★★★
       Everything a visitor reads lives in this one CONFIG object.
       Replace the [BRACKETED] placeholders with your own words,
       links and projects — nothing else in the file needs to change.
       ================================================================ */
    const CONFIG = {
      name: "[YOUR NAME]",
      tagline: "[Your tagline — e.g. data analytics student turning messy data into clear stories]",
      aboutEmoji: "🌸",
      intro: "[A warm one-paragraph introduction. Who are you, what are you studying, and what gets you excited about data? Two or three friendly sentences work best here.]",
      background: "[Your background — where your interest in analytics started, what you have done so far, and where you hope it takes you. Keep it personal, not a résumé.]",
      education: [
        "[University / school name] — [Degree or program], [start year – end year]",
        "[Another course, certificate, or program — e.g. Google Data Analytics Certificate]",
        "[Optional third entry — a class, bootcamp, or self-study path]"
      ],
      whatIDo: [
        "[Turn raw data into clean, trustworthy datasets]",
        "[Build dashboards and charts people actually enjoy reading]",
        "[Answer real questions with SQL, Python and statistics]",
        "[Explain findings simply, without the jargon]"
      ],
      skills: ["Python", "SQL", "Excel", "Tableau", "Power BI", "Pandas", "[add a skill]", "[add a skill]"],
      funFacts: [
        "[A fun fact about you — a hobby, a quirk, a favourite snack]",
        "[Another one — the more human, the better]",
        "[And one more for luck]"
      ],

      /* Categories must be one of: Analysis · Visualization · SQL · Machine Learning */
      projects: [
        { title: "[Project title]", category: "Analysis", emoji: "📊", accent: "#ff9cc6",
          description: "[One or two sentences: what question did you answer, what data did you use, and what did you find?]",
          tools: ["Python", "Pandas"], link: "#" },
        { title: "[Project title]", category: "Visualization", emoji: "📈", accent: "#8fc6f5",
          description: "[Describe the dashboard or chart story you built and who it helps.]",
          tools: ["Tableau", "Excel"], link: "#" },
        { title: "[Project title]", category: "SQL", emoji: "🗄️", accent: "#bd9bf0",
          description: "[Describe the database you queried and the insights your SQL uncovered.]",
          tools: ["SQL", "PostgreSQL"], link: "#" },
        { title: "[Project title]", category: "Machine Learning", emoji: "🤖", accent: "#8fe3bc",
          description: "[Describe the model you trained, what it predicts, and how well it did.]",
          tools: ["Python", "scikit-learn"], link: "#" },
        { title: "[Project title]", category: "Analysis", emoji: "🧹", accent: "#ffcf87",
          description: "[Describe a messy dataset you cleaned and the story hiding inside it.]",
          tools: ["Python", "Excel"], link: "#" },
        { title: "[Project title]", category: "Visualization", emoji: "🎨", accent: "#ffadd0",
          description: "[Describe a visual storytelling piece — an infographic, report or interactive chart.]",
          tools: ["Power BI", "Canva"], link: "#" }
      ],

      email: "[your.email@example.com]",
      availability: "[Currently open to internships, freelance projects and collaborations — edit this line!]",
      socials: [
        { label: "Email",     icon: "✉️", display: "[your.email@example.com]",        href: "mailto:[your.email@example.com]" },
        { label: "LinkedIn",  icon: "💼", display: "[linkedin.com/in/your-name]",     href: "#" },
        { label: "GitHub",    icon: "🐙", display: "[github.com/your-username]",      href: "#" },
        { label: "Instagram", icon: "📸", display: "[@your.handle]",                  href: "#" }
      ]
    };
    /* ===================  END OF EDITABLE CONTENT  =================== */
    </script>
    <script>
    /* ==================== 3D APP ==================== */
    (function(){
      "use strict";
      const wrap = document.getElementById('scene-wrap');
      const loaderEl = document.getElementById('loader');
      const tooltip = document.getElementById('tooltip');
      const hintEl = document.getElementById('hint');
      const isMobile = Math.min(window.innerWidth, window.innerHeight) < 640;
      const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ---------- renderer / scene / camera ---------- */
      const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });

          const inner = mesh(new THREE.ConeGeometry(0.045, 0.13, 4), MAT.pinkSoft, x*0.9, 0.2, 0.045);
          inner.scale.z = 0.5;
          inner.rotation.y = Math.PI/4; inner.rotation.z = x > 0 ? -0.12 : 0.12; catHead.add(inner);
        });
        // almond blue eyes
        [-0.095, 0.095].forEach(function(x){
          const eye = SPH(0.042, std(0x3d7fc4, 0.3), x, 0.03, 0.2); eye.scale.set(1.05, 0.72, 0.55); catHead.add(eye);

        const mouth = mesh(new THREE.TorusGeometry(0.028, 0.005, 6, 14, Math.PI), std(0xc98a7a, 0.7), 0, -0.075, 0.235);
        mouth.rotation.x = 0.25; mouth.rotation.z = Math.PI; catHead.add(mouth);
        // whiskers — thin grey lines fanning out both sides
        const whiskerMat = new THREE.LineBasicMaterial({ color:0x9a8fa8 });
        const wPts = [];
        [-1, 1].forEach(function(s){
          [[0.16,0.02],[-0.01,-0.015],[-0.18,-0.05]].forEach(function(a){
            wPts.push(new THREE.Vector3(s*0.09, -0.06, 0.2), new THREE.Vector3(s*0.34, -0.06+a[0]*0.35, 0.2+a[1]));
          });

        const whiskers = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(wPts), whiskerMat);
        catHead.add(whiskers);
        catRoot.add(catHead);

        /* ---- tail: a proper curved tube wrapping around one side ---- */
        catTail = new THREE.Group(); catTail.position.set(0.22, 0.05, -0.2);
        const tailCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0.02, 0),
          new THREE.Vector3(0.16, 0.03, 0.1),
          new THREE.Vector3(0.2, 0.04, 0.32),
          new THREE.Vector3(0.1, 0.05, 0.5),
          new THREE.Vector3(-0.06, 0.06, 0.56)
        ]);
        const tailMesh = mesh(new THREE.TubeGeometry(tailCurve, 20, 0.055, 10), fur, 0, 0, 0, true, true);
        catTail.add(tailMesh);
        const tip = SPH(0.058, creamFur, -0.06, 0.06, 0.56); catTail.add(tip);
        catRoot.add(catTail);

        // tiny pink collar + bell
        const collar = mesh(new THREE.TorusGeometry(0.155, 0.028, 10, 24), MAT.pinkSoft, 0, 0.64, 0.06, true, true);
        collar.rotation.x = Math.PI/2 - 0.15; catRoot.add(collar);
        const bell = SPH(0.04, std(0xffc2da, 0.4, { metalness:0.35 }), 0, 0.5, 0.3); catRoot.add(bell);
        room.add(catRoot);
      })();

      /* ---------- wooden signpost ---------- */
      const signTargets = [
        { text:'MY WORK',  view:'work' },
        { text:'ABOUT ME', view:'about' },
        { text:'CONTACT',  view:'contact' }
      ];
      (function buildSignpost(){
        const post = new THREE.Group(); post.position.set(-8.7, -1.15, 2.4); scene.add(post);
        const mound = mesh(new THREE.CircleGeometry(1.5, 24), std(0x3fbc62, 1), 0, 0.02, 0);
        mound.rotation.x = -Math.PI/2; post.add(mound);
        post.add(CYL(0.09, 0.13, 0.35, std(0xa8b8c8, 0.95), 0.3, 0.05, 0.3));
        post.add(CYL(0.13, 0.16, 4.4, MAT.woodDark, 0, 2.2, 0));
        post.add(SPH(0.19, MAT.wood, 0, 4.48, 0));
        const labelFor = { work:'My Work — peek at the iMac 🖥️', about:'About Me — meet the human 👩‍💻', contact:'Contact — open the notebook 📓' };
        signTargets.forEach(function(s, i){
          const g = new THREE.Group();
          const y = 3.85 - i*1.05;
          g.position.set(0.42, y, 0);
          g.rotation.y = 0.5;
          g.rotation.z = (i%2? -1:1)*0.045;
          const board = RB(2.25, 0.64, 0.09, 0.04, MAT.wood, 0.62, 0, 0);
          g.add(board);
          const face = mesh(new THREE.PlaneGeometry(2.19, 0.58),
            new THREE.MeshStandardMaterial({ map:signTex(s.text), roughness:0.8, transparent:false }), 0.62, 0, 0.052);
          g.add(face);
          g.add(CYL(0.045,0.045,0.3, MAT.woodDark, -0.42, 0, 0)).children;
          g.children[g.children.length-1].rotation.x = Math.PI/2;
          post.add(g);
          signBoards.push({ g:g, phase:i*1.7, baseY:y, baseRotZ:g.rotation.z });
          registerInteractive(g, 'sign', s.view, labelFor[s.view]);
        });
        const tuftP = addPlant(0.9, MAT.pink); tuftP.position.set(-0.7, 0, 0.7); post.add(tuftP);
      })();

      /* ---------- dust particles ---------- */
      let dust, dustBase;
      (function buildDust(){
        const N = isMobile ? 60 : 130;
        const pos = new Float32Array(N*3);
        dustBase = new Float32Array(N*3);
        for(let i=0;i<N;i++){
          dustBase[i*3]   = (Math.random()-0.5)*17;
          dustBase[i*3+1] = Math.random()*7.5+0.3;
          dustBase[i*3+2] = (Math.random()-0.5)*13+0.5;
        }
        pos.set(dustBase);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const sprite = canvasTex(64,64,function(ctx){
          const g = ctx.createRadialGradient(32,32,2,32,32,30);
          g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
          ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
        });
        dust = new THREE.Points(geo, new THREE.PointsMaterial({
          size:0.14, map:sprite, transparent:true, opacity:0.55,
          depthWrite:false, color:0xfff3d6, sizeAttenuation:true
        }));
        scene.add(dust);
      })();
      /* ---------- custom orbit controls (damped, touch + pinch) ---------- */
      const controls = {
        target: new THREE.Vector3(-0.5, 2.0, -0.5),
        goalTarget: new THREE.Vector3(-0.5, 2.0, -0.5),
        sph: new THREE.Spherical(21, 1.08, 0.72),
        goalSph: new THREE.Spherical(21, 1.08, 0.72),
        enabled: true, suspended: false, autoRotate: !REDUCED, interacted: false
      };
      controls.sph.phi = 1.02;
      controls.goalSph.phi = 1.02;
      function syncControlsFromCamera(){
        const off = camera.position.clone().sub(controls.target);
        const s = new THREE.Spherical().setFromVector3(off);
        controls.sph.copy(s); controls.goalSph.copy(s);
        controls.goalTarget.copy(controls.target);
      }
      const pointers = new Map();
      let pinchDist = 0;
      const el = renderer.domElement;
      el.addEventListener('pointerdown', function(e){
        pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
        if(pointers.size === 2){
          const p = Array.from(pointers.values());
          pinchDist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
        }
        controls.interacted = true; controls.autoRotate = false;
        hintEl.style.opacity = '0.55';
      });
      el.addEventListener('pointermove', function(e){
        mouseNDC.x = (e.clientX/window.innerWidth)*2-1;
        mouseNDC.y = -(e.clientY/window.innerHeight)*2+1;
        mouseClient.x = e.clientX; mouseClient.y = e.clientY;
        mouseDirty = true;
        if(!controls.enabled || controls.suspended) return;
        const prev = pointers.get(e.pointerId);
        if(!prev) return;
        const dx = e.clientX-prev.x, dy = e.clientY-prev.y;
        pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
        if(pointers.size === 1){
          controls.goalSph.theta -= dx*0.0052;
          controls.goalSph.phi = Math.max(0.18, Math.min(1.45, controls.goalSph.phi - dy*0.0052));
        } else if(pointers.size === 2){
          const p = Array.from(pointers.values());
          const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
          if(pinchDist > 0){
            controls.goalSph.radius = Math.max(6.5, Math.min(34, controls.goalSph.radius * (pinchDist/d)));
          }
          pinchDist = d;
        }
      });
      function endPointer(e){ pointers.delete(e.pointerId); if(pointers.size<2) pinchDist = 0; }
      el.addEventListener('pointerup', endPointer);
      el.addEventListener('pointercancel', endPointer);
      el.addEventListener('wheel', function(e){
        if(!controls.enabled || controls.suspended) return;
        e.preventDefault();
        controls.interacted = true; controls.autoRotate = false;
        controls.goalSph.radius = Math.max(6.5, Math.min(34, controls.goalSph.radius * (1 + e.deltaY*0.0011)));
      }, { passive:false });
      function updateControls(){
        if(controls.suspended) return;
        if(controls.autoRotate && state === 'home') controls.goalSph.theta += 0.0016;
        const k = 0.075;
        controls.sph.radius += (controls.goalSph.radius - controls.sph.radius)*k;
        controls.sph.theta  += (controls.goalSph.theta  - controls.sph.theta )*k;
        controls.sph.phi    += (controls.goalSph.phi    - controls.sph.phi   )*k;
        controls.target.lerp(controls.goalTarget, k);
        const off = new THREE.Vector3().setFromSpherical(controls.sph);
        camera.position.copy(controls.target).add(off);
        camera.lookAt(controls.target);
      }

      /* ---------- camera flights + app state ---------- */
      const VIEWS = {
        home:    { pos:new THREE.Vector3(11.5, 9.5, 14.5),  tgt:new THREE.Vector3(-0.5, 2.0, -0.5) },
        work:    { pos:new THREE.Vector3(-2.55, 3.55, -0.55), tgt:new THREE.Vector3(-2.55, 3.42, -3.75) },
        about:   { pos:new THREE.Vector3(-1.15, 5.35, -1.55), tgt:new THREE.Vector3(-1.15, 5.1, -4.3) },
        contact: { pos:new THREE.Vector3(-0.85, 4.4, -1.15),  tgt:new THREE.Vector3(-0.95, 2.15, -3.25) }
      };
      let state = 'home'; // home | flying | work | about | contact
      let camAnim = null;
      function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
      function flyTo(viewName, dur, onDone){
        const v = VIEWS[viewName];
        camAnim = {
          t0: performance.now(), dur: dur || 1900,
          fromPos: camera.position.clone(), fromTgt: controls.target.clone(),
          toPos: v.pos.clone(), toTgt: v.tgt.clone(), onDone: onDone || null
        };
        controls.suspended = true;
        state = 'flying';
      }
      const panels = {
        work: document.getElementById('panel-work'),
        about: document.getElementById('panel-about'),
        contact: document.getElementById('panel-contact')
      };
      function openSection(view){
        if(state === 'flying' || state === view) return;
        hideHint();
        flyTo(view, 1900, function(){
          state = view;
          panels[view].classList.add('open');
          panels[view].setAttribute('aria-hidden','false');
          controls.enabled = false;
        });
      }
      function backToRoom(){
        if(state === 'home' || state === 'flying') return;
        Object.keys(panels).forEach(function(k){
          panels[k].classList.remove('open');
          panels[k].setAttribute('aria-hidden','true');
        });
        showGallery();
        flyTo('home', 1700, function(){
          state = 'home';
          controls.enabled = true;
        });
      }
      document.querySelectorAll('[data-back]').forEach(function(b){
        b.addEventListener('click', backToRoom);
      });
      document.addEventListener('keydown', function(e){
        if(e.key === 'Escape' && state !== 'home' && state !== 'flying') backToRoom();
      });
      let hintHidden = false;
      function hideHint(){ if(!hintHidden){ hintHidden = true; hintEl.style.opacity = '0'; setTimeout(function(){ hintEl.style.display='none'; }, 600); } }
      document.getElementById('btn-reset').addEventListener('click', function(){
        if(state !== 'home' && state !== 'flying') backToRoom();
        else if(state === 'home'){
          controls.autoRotate = false; controls.interacted = true;
          flyTo('home', 1200, function(){ state='home'; controls.enabled = true; });
        }
      });

      /* ---------- day / night ---------- */
      let night = false, dayK = 1;
      const dayNightBtn = document.getElementById('btn-daynight');
      dayNightBtn.addEventListener('click', function(){
        night = !night;
        dayNightBtn.textContent = night ? '☀️' : '🌙';
      });
      function lerp(a,b,t){ return a+(b-a)*t; }
      function applyDayNight(){
        hemi.intensity = lerp(0.18, 0.55, dayK);
        sun.intensity  = lerp(0.3, 1.45, dayK);
        sun.color.setHex(dayK < 0.5 ? 0xcdd8ff : 0xffdfae);
        fill.intensity = lerp(0.06, 0.22, dayK);
        scene.background.copy(NIGHT_SKY).lerp(DAY_SKY, dayK);
        scene.fog.color.copy(scene.background);
        bulbMats.forEach(function(m){ m.emissiveIntensity = lerp(2.4, 0.85, dayK); });
        lampLight.intensity = lerp(1.4, 0.25, dayK);
        screenLight.intensity = lerp(0.8, 0.35, dayK);
        const lamp = room.userData.lamp;
        if(lamp){
          lamp.userData.shadeMat.emissiveIntensity = lerp(1.1, 0.25, dayK);
          lamp.userData.bulbMat.emissiveIntensity = lerp(2.2, 0.8, dayK);
        }
        if(pcGlowMat) pcGlowMat.emissiveIntensity = lerp(0.9, 0.25, dayK);
      }

      /* ---------- raycast hover / click ---------- */
      const raycaster = new THREE.Raycaster();
      const mouseNDC = new THREE.Vector2(-2,-2);
      const mouseClient = { x:0, y:0 };
      let mouseDirty = false, hovered = null;
      let downPos = null, downTime = 0;
      el.addEventListener('pointerdown', function(e){ downPos = { x:e.clientX, y:e.clientY }; downTime = performance.now(); });
      el.addEventListener('pointerup', function(e){
        if(!downPos) return;
        const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
        const dt = performance.now()-downTime;
        downPos = null;
        if(moved > 7 || dt > 450) return;
        mouseNDC.x = (e.clientX/window.innerWidth)*2-1;
        mouseNDC.y = -(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouseNDC, camera);
        const hits = raycaster.intersectObjects(interactiveRoots, true);
        if(hits.length){
          let o = hits[0].object;
          while(o && !o.userData.interactive) o = o.userData.hitRoot || o.parent;
          if(o && o.userData.interactive) openSection(o.userData.interactive.view);
        }
      });
      function setHovered(root){
        if(hovered === root) return;
        hovered = root;
        if(root){
          tooltip.textContent = root.userData.interactive.label;
          tooltip.classList.add('show');
          el.style.cursor = 'pointer';
        } else {
          tooltip.classList.remove('show');
          el.style.cursor = '';
        }
      }
      function updateHover(){
        if(!mouseDirty) return;
        mouseDirty = false;
        if(state === 'flying'){ setHovered(null); return; }
        raycaster.setFromCamera(mouseNDC, camera);
        const hits = raycaster.intersectObjects(interactiveRoots, true);
        let root = null;
        if(hits.length){
          let o = hits[0].object;
          while(o && !o.userData.interactive) o = o.userData.hitRoot || o.parent;
          root = o;
        }
        setHovered(root);
        tooltip.style.left = mouseClient.x + 'px';
        tooltip.style.top = mouseClient.y + 'px';
      }
      function applyHoverEffects(dt){
        interactiveRoots.forEach(function(root){
          const d = root.userData.interactive;
          const target = (hovered === root) ? 1 : 0;
          d.hoverK += (target - d.hoverK) * Math.min(1, dt*10);
          const k = d.hoverK;
          if(d.kind === 'sign'){
            const s = 1 + 0.08*k;
            root.scale.set(s, s, s);
          } else if(d.kind === 'imac'){
            // handled via screen glow in animate
          } else if(d.kind === 'frame'){
            root.position.z = frameBase.z + 0.12*k;
          } else if(d.kind === 'notebook'){
            root.rotation.z = Math.sin(perfNow*0.02)*0.05*k;
          }
        });
      }

      /* ---------- build HTML panels from CONFIG ---------- */
      document.getElementById('about-name').textContent = 'Hi, I\u2019m ' + CONFIG.name;
      document.getElementById('about-tagline').textContent = CONFIG.tagline;
      document.getElementById('about-emoji').textContent = CONFIG.aboutEmoji || '🌸';
      document.getElementById('about-intro').textContent = CONFIG.intro;
      document.getElementById('about-background').textContent = CONFIG.background;
      function fillList(id, items){
        const ul = document.getElementById(id);

      }
      fillList('about-education', CONFIG.education);
      fillList('about-whatido', CONFIG.whatIDo);
      fillList('about-facts', CONFIG.funFacts);
      const skillsEl = document.getElementById('about-skills');
      CONFIG.skills.forEach(function(s){
        const sp = document.createElement('span'); sp.className = 'pill'; sp.textContent = s; skillsEl.appendChild(sp);
      });
      document.getElementById('contact-availability').textContent = CONFIG.availability;
      const rowsEl = document.getElementById('contact-rows');
      CONFIG.socials.forEach(function(s){
        const a = document.createElement('a');

      });

      const FILTERS = ['All','Analysis','Visualization','SQL','Machine Learning'];
      const chipsEl = document.getElementById('chips');
      const gridEl = document.getElementById('project-grid');
      const galleryView = document.getElementById('gallery-view');
      const detailView = document.getElementById('detail-view');
      const detailContent = document.getElementById('detail-content');
      let activeFilter = 'All';
      FILTERS.forEach(function(f){
        const b = document.createElement('button');
        b.className = 'chip' + (f === 'All' ? ' active' : '');
        b.textContent = f;
        b.addEventListener('click', function(){

          chipsEl.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c.textContent === f); });

      });
      function projectCard(p){
        const card = document.createElement('article');
        card.className = 'proj';
        card.style.background = p.accent;
        const thumb = document.createElement('div'); thumb.className = 'thumb'; thumb.textContent = p.emoji;
        const h = document.createElement('h3'); h.textContent = p.title;
        const cat = document.createElement('span'); cat.className = 'cat'; cat.textContent = p.category;
        const desc = document.createElement('p'); desc.textContent = p.description;
        const tags = document.createElement('div'); tags.className = 'tags';
        p.tools.forEach(function(t){ const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = t; tags.appendChild(tg); });
        card.append(thumb, cat, h, desc, tags);
        card.addEventListener('click', function(){ openProject(p); });

      }
      function renderProjects(){
        gridEl.innerHTML = '';
        CONFIG.projects
          .filter(function(p){ return activeFilter === 'All' || p.category === activeFilter; })
          .forEach(function(p){ gridEl.appendChild(projectCard(p)); });
        if(!gridEl.children.length){
          const empty = document.createElement('p');

        }
      }
      function openProject(p){
        detailContent.innerHTML = '';
        const hero = document.createElement('div'); hero.className = 'detail-hero'; hero.textContent = p.emoji;
        hero.style.background = p.accent; hero.style.borderRadius = '18px'; hero.style.padding = '22px 0 14px';
        const h = document.createElement('h2'); h.textContent = p.title;
        const cat = document.createElement('div'); cat.className = 'd-cat'; cat.textContent = p.category;
        const desc = document.createElement('p'); desc.className = 'd-desc'; desc.textContent = p.description;
        const tags = document.createElement('div'); tags.className = 'tags';

      function showGallery(){ galleryView.hidden = false; detailView.hidden = true; }
      document.getElementById('detail-back').addEventListener('click', showGallery);
      renderProjects();
      document.getElementById('mac-title').textContent = CONFIG.name === '[YOUR NAME]' ? 'My Work' : CONFIG.name + '\u2019s Work';

      const form = document.getElementById('contact-form');
      const sendBtn = document.getElementById('send-btn');
      form.addEventListener('submit', function(e){
        e.preventDefault();
        if(sendBtn.classList.contains('sent')) return;
        sendBtn.textContent = 'Sending…';
        sendBtn.disabled = true;
        setTimeout(function(){
          sendBtn.textContent = 'Sent! ✓';
          sendBtn.classList.add('sent');
          form.querySelectorAll('input, textarea').forEach(function(f){ f.value=''; });
          setTimeout(function(){
            sendBtn.textContent = 'Send ✉️';
            sendBtn.classList.remove('sent');
            sendBtn.disabled = false;
          }, 2600);
        }, 650);
      });

      /* ---------- resize ---------- */
      window.addEventListener('resize', function(){
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* ---------- animation loop ---------- */
      const clockT = new THREE.Clock();
      let perfNow = 0, firstFrame = true;
      // initial camera placement
      camera.position.copy(VIEWS.home.pos);
      controls.target.copy(VIEWS.home.tgt);
      controls.goalTarget.copy(VIEWS.home.tgt);
      syncControlsFromCamera();

      function animate(){
        requestAnimationFrame(animate);
        const dt = Math.min(clockT.getDelta(), 0.05);
        const t = clockT.elapsedTime;
        perfNow = performance.now();

        // camera flight tween
        if(camAnim){
          const k = Math.min(1, (perfNow - camAnim.t0)/camAnim.dur);
          const e = easeInOutCubic(k);
          camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
          const curTgt = camAnim.fromTgt.clone().lerp(camAnim.toTgt, e);
          camera.lookAt(curTgt);
          controls.target.copy(curTgt);
          if(k >= 1){
            const done = camAnim.onDone;
            camAnim = null;
            controls.suspended = false;
            syncControlsFromCamera();
            if(done) done();
          }
        } else {
          updateControls();
        }

        // day/night easing
        dayK += ((night ? 0 : 1) - dayK) * Math.min(1, dt*3.2);
        applyDayNight();

        // plants swaying
        for(let i=0;i<swayPlants.length;i++){
          const p = swayPlants[i];
          p.g.rotation.z = Math.sin(t*p.speed + p.phase) * p.amp;
          p.g.rotation.x = Math.cos(t*p.speed*0.8 + p.phase) * p.amp * 0.6;
        }
        // sign boards gentle float
        for(let i=0;i<signBoards.length;i++){
          const s = signBoards[i];
          s.g.position.y = s.baseY + Math.sin(t*0.9 + s.phase) * 0.05;
          s.g.rotation.z = s.baseRotZ + Math.sin(t*0.7 + s.phase) * 0.018;
        }
        // cat idle: slow breathing, tail swish, lazy look-around
        if(catRoot){
          const br = Math.sin(t*1.6);
          catRoot.scale.set(1 + br*0.012, 1 + br*0.022, 1 + br*0.012);
          if(catTail) catTail.rotation.y = Math.sin(t*1.3)*0.24;
          if(catHead){
            catHead.rotation.y = Math.sin(t*0.45)*0.32;
            catHead.rotation.z = Math.sin(t*0.8)*0.03;
          }
        }
        // iMac screen pulse (+ hover glow)
        if(screenGlowMat){
          const imacRoot = interactiveRoots.find(function(r){ return r.userData.interactive.kind === 'imac'; });
          const hk = imacRoot ? imacRoot.userData.interactive.hoverK : 0;
          screenGlowMat.emissiveIntensity = lerp(1.05, 0.5, dayK) + Math.sin(t*1.8)*0.07 + hk*0.55;
          screenLight.intensity = lerp(0.85, 0.4, dayK) + hk*0.5;
        }
        // clock second hand
        if(room.userData.clock) room.userData.clock.userData.secPivot.rotation.z = -t * (Math.PI*2/60);
        // photo frame extra bob while About is open
        if(frameGroup){
          const target = (state === 'about') ? 1 : 0;
          frameGroup.userData.aboutK = ((frameGroup.userData.aboutK || 0) + (target - (frameGroup.userData.aboutK || 0)) * Math.min(1, dt*3));
          const ak = frameGroup.userData.aboutK;
          if(ak > 0.01){
            frameGroup.position.y = frameBase.y + Math.sin(t*1.6)*0.05*ak + 0.06*ak;
            frameGroup.rotation.y = Math.sin(t*1.1)*0.05*ak;
          } else {
            frameGroup.position.y = frameBase.y;
            frameGroup.rotation.y = 0;
          }
        }
        // dust drift
        if(dust){
          const pos = dust.geometry.attributes.position;
          for(let i=0;i<pos.count;i++){
            pos.array[i*3]   = dustBase[i*3]   + Math.sin(t*0.22 + i*1.7)*0.35;
            pos.array[i*3+1] = dustBase[i*3+1] + Math.sin(t*0.15 + i*2.3)*0.3 + Math.sin(t*0.05+i)*0.1;
            pos.array[i*3+2] = dustBase[i*3+2] + Math.cos(t*0.18 + i)*0.3;
          }
          pos.needsUpdate = true;
          dust.material.opacity = lerp(0.8, 0.5, dayK);
        }

        updateHover();
        applyHoverEffects(dt);
        renderer.render(scene, camera);

        if(firstFrame){
          firstFrame = false;
          window.__tinyRoomReady = true;
          setTimeout(function(){ loaderEl.classList.add('done'); }, 350);
        }
      }
      animate();
    })();
    </script>
    <script>
      setTimeout(function(){
        if(!window.__tinyRoomReady){
          var p = document.querySelector('#loader p');
          if(p) p.textContent = 'still building… if this takes a while, check your connection and refresh 🏠';
        }
      }, 9000);
    </script>
  </body>
